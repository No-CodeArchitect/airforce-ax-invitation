<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관리자 | 공군 AX 설명회</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { background: #f8fafc; }
    .admin-wrap { padding: 70px clamp(20px,5vw,82px); }
    .admin-shell { display: grid; gap: 22px; }
    .login, .admin-card { padding: 28px; border-radius: 30px; background: white; box-shadow: 0 24px 64px rgba(15,23,42,.08); }
    .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; }
    .stat { padding: 24px; border-radius: 24px; color: white; background: linear-gradient(135deg, var(--navy), var(--blue)); }
    .stat strong { display: block; font-size: 42px; line-height: 1; }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; margin: 18px 0; }
    .danger { color: #b91c1c; border-color: #fecaca; background: #fff7f7; }
    .danger:hover { background: #fee2e2; }
    select, textarea { padding: 13px 14px; border: 1px solid #cbd5e1; border-radius: 14px; font: inherit; }
    table { width: 100%; border-collapse: collapse; overflow: hidden; border-radius: 18px; }
    th, td { padding: 14px; border-bottom: 1px solid #e2e8f0; text-align: left; font-size: 14px; vertical-align: top; }
    th { color: var(--navy); background: #eff6ff; }
    .hidden { display: none; }
    .mailbox { display: grid; gap: 12px; margin-top: 20px; padding: 18px; border: 1px solid var(--line); border-radius: 18px; background: #f8fafc; }
    @media (max-width: 800px) { .stats { grid-template-columns: 1fr; } table { display: block; overflow-x: auto; } }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark"><img src="assets/collaboration-mark.png" alt=""></span><span>서울대·공군 AX 협력센터</span></a>
    <nav class="nav"><a href="index.html">랜딩 페이지</a></nav>
  </header>

  <main class="admin-wrap">
    <section class="login" id="loginBox">
      <p class="eyebrow">Static Session</p>
      <h1>관리자 인증</h1>
      <label>비밀번호<input type="password" id="password" autocomplete="current-password"></label>
      <button class="button primary" id="loginButton" style="margin-top:14px">접속</button>
      <p class="form-status" id="loginStatus"></p>
    </section>

    <section class="admin-shell hidden" id="dashboard">
      <div class="section-heading">
        <p class="eyebrow">Applications</p>
        <h2>참가 신청 현황</h2>
      </div>
      <div class="stats">
        <div class="stat"><span>신청 기업</span><strong id="companyCount">0</strong><small>접수 건수</small></div>
        <div class="stat"><span>총 참석 인원</span><strong id="attendeeCount">0</strong><small>동반자 포함</small></div>
        <div class="stat"><span>밋업 희망</span><strong id="meetupCount">0</strong><small>기업</small></div>
      </div>
      <div class="admin-card">
        <div class="controls">
          <select id="projectFilter">
            <option value="">관심 과제 전체</option>
            <option value="ADTO 전투계획 작성 모델">ADTO 전투계획 작성 모델</option>
            <option value="이동표적 위치추적 모델">이동표적 위치추적 모델</option>
            <option value="표적 자동 식별 모델">표적 자동 식별 모델</option>
          </select>
          <select id="meetupFilter">
            <option value="">밋업 전체</option>
            <option value="Y">밋업 참여</option>
            <option value="N">밋업 미참여</option>
          </select>
          <button class="button ghost" id="downloadCsv">CSV 다운로드</button>
          <button class="button ghost danger" id="deleteSelected">선택 삭제</button>
        </div>
        <table>
          <thead>
            <tr><th><input type="checkbox" id="selectAll" aria-label="전체 선택"></th><th>기업명</th><th>참석자</th><th>연락처</th><th>관심 과제</th><th>밋업</th><th>신청일</th></tr>
          </thead>
          <tbody id="applicationRows"></tbody>
        </table>
        <div class="mailbox">
          <strong>공지 메일 발송 모달 대체 영역</strong>
          <textarea id="mailMessage" rows="4">안녕하세요. 공군 AX 거점 소개 및 연구과제 설명회 리마인드 안내드립니다.</textarea>
          <button class="button primary" id="sendMail">선택 기업 공지 발송 시뮬레이션</button>
          <p class="form-status" id="mailStatus"></p>
        </div>
      </div>
    </section>
  </main>

  <script>
    let applications = [];
    let adminPassword = sessionStorage.getItem("rokafAdminPassword") || "";
    const rows = document.querySelector("#applicationRows");

    document.querySelector("#loginButton").addEventListener("click", async () => {
      adminPassword = document.querySelector("#password").value;
      if (await loadApplications()) {
        sessionStorage.setItem("rokafAdminPassword", adminPassword);
        document.querySelector("#loginBox").classList.add("hidden");
        document.querySelector("#dashboard").classList.remove("hidden");
        render();
      } else {
        document.querySelector("#loginStatus").textContent = "비밀번호가 일치하지 않습니다.";
      }
    });

    async function loadApplications() {
      if (!adminPassword) return false;
      try {
        const response = await fetch("/api/applications", { headers: { "x-admin-password": adminPassword } });
        if (!response.ok) return false;
        const result = await response.json();
        applications = result.applications;
        return true;
      } catch {
        return false;
      }
    }

    function filtered() {
      const project = document.querySelector("#projectFilter").value;
      const meetup = document.querySelector("#meetupFilter").value;
      return applications.filter((item) => (!project || item.selected_projects.includes(project)) && (!meetup || item.meetup_status === meetup));
    }

    function render() {
      const all = applications;
      const companyCount = all.length;
      document.querySelector("#companyCount").textContent = companyCount;
      document.querySelector("#attendeeCount").textContent = all.reduce((sum, item) => sum + 1 + (item.attendee2_name ? 1 : 0), 0);
      document.querySelector("#meetupCount").textContent = all.filter((item) => item.meetup_status === "Y").length;
      rows.innerHTML = filtered().map((item) => `
        <tr>
          <td><input type="checkbox" value="${item.id}"></td>
          <td>${escapeHtml(item.company_name)}</td>
          <td>${escapeHtml(item.attendee1_name)} ${escapeHtml(item.attendee1_role)}${item.attendee2_name ? `<br>${escapeHtml(item.attendee2_name)} ${escapeHtml(item.attendee2_role)}` : ""}</td>
          <td>${escapeHtml(item.attendee1_email)}<br>${escapeHtml(item.attendee1_phone)}</td>
          <td>${item.selected_projects.map(escapeHtml).join("<br>")}</td>
          <td>${item.meetup_status}</td>
          <td>${new Date(item.created_at).toLocaleString("ko-KR")}</td>
        </tr>
      `).join("") || `<tr><td colspan="7">신청 데이터가 없습니다.</td></tr>`;
    }

    function escapeHtml(value = "") {
      return String(value).replace(/[&<>"']/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[character]);
    }

    document.querySelectorAll("select").forEach((item) => item.addEventListener("change", render));
    document.querySelector("#selectAll").addEventListener("change", (event) => {
      rows.querySelectorAll('input[type="checkbox"]').forEach((checkbox) => {
        checkbox.checked = event.target.checked;
      });
    });
    document.querySelector("#deleteSelected").addEventListener("click", async () => {
      const ids = [...rows.querySelectorAll('input[type="checkbox"]:checked')].map((checkbox) => Number(checkbox.value));
      if (!ids.length) return alert("삭제할 신청을 선택해 주세요.");
      if (!confirm(`선택한 ${ids.length}건의 신청을 DB에서 삭제할까요?`)) return;

      const response = await fetch("/api/applications", {
        method: "DELETE",
        headers: { "Content-Type": "application/json", "x-admin-password": adminPassword },
        body: JSON.stringify({ ids })
      });
      const result = await response.json();
      if (!response.ok) return alert(result.error || "삭제에 실패했습니다.");
      applications = applications.filter((item) => !ids.includes(Number(item.id)));
      document.querySelector("#selectAll").checked = false;
      render();
    });
    document.querySelector("#downloadCsv").addEventListener("click", () => {
      const header = ["기업명","신청자","직책","이메일","휴대전화","동반자","동반자직책","관심과제","밋업","신청일"];
      const lines = filtered().map((item) => [item.company_name,item.attendee1_name,item.attendee1_role,item.attendee1_email,item.attendee1_phone,item.attendee2_name,item.attendee2_role,item.selected_projects.join(" / "),item.meetup_status,item.created_at].map((cell) => `"${String(cell || "").replaceAll('"','""')}"`).join(","));
      const blob = new Blob(["\ufeff" + [header.join(","), ...lines].join("\n")], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = Object.assign(document.createElement("a"), { href: url, download: "공군_AX_설명회_신청현황.csv" });
      link.click();
      URL.revokeObjectURL(url);
    });
    document.querySelector("#sendMail").addEventListener("click", () => {
      const selected = [...rows.querySelectorAll("input:checked")].length;
      document.querySelector("#mailStatus").textContent = selected ? `${selected}개 기업 대상으로 공지 발송을 시뮬레이션했습니다.` : "공지 발송할 기업을 선택해 주세요.";
    });
    if (adminPassword) {
      loadApplications().then((authenticated) => {
        if (!authenticated) return sessionStorage.removeItem("rokafAdminPassword");
        document.querySelector("#loginBox").classList.add("hidden");
        document.querySelector("#dashboard").classList.remove("hidden");
        render();
      });
    }
  </script>
</body>
</html>
